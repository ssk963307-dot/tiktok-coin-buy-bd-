<!DOCTYPE html>
<html lang="bn">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>RAW SUJON Store</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: Arial, sans-serif;
    }

    body {
      background: #0b0b12;
      color: white;
    }

    header {
      padding: 22px;
      text-align: center;
      background: #11111c;
      border-bottom: 1px solid #29293a;
    }

    .logo {
      font-size: 28px;
      font-weight: bold;
    }

    .logo span {
      color: #00f2ea;
    }

    .hero {
      text-align: center;
      padding: 45px 20px;
    }

    .hero h1 {
      font-size: 32px;
      margin-bottom: 10px;
    }

    .hero p {
      color: #aaa;
    }

    .packages {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
      gap: 15px;
      max-width: 900px;
      margin: auto;
      padding: 20px;
    }

    .card {
      background: #151522;
      border: 1px solid #29293a;
      border-radius: 14px;
      padding: 20px;
      text-align: center;
    }

    .coin {
      font-size: 22px;
      font-weight: bold;
      margin-bottom: 8px;
    }

    .price {
      color: #00f2ea;
      font-size: 20px;
      font-weight: bold;
      margin-bottom: 15px;
    }

    button {
      border: none;
      border-radius: 8px;
      padding: 10px 18px;
      background: #ff0050;
      color: white;
      font-weight: bold;
      cursor: pointer;
    }

    footer {
      text-align: center;
      padding: 35px 15px;
      color: #777;
    }
  </style>
</head>

<body>

  <header>
    <div class="logo">RAW <span>SUJON</span></div>
  </header>

  <section class="hero">
    <h1>Digital Package Store</h1>
    <p>Choose your preferred package</p>
  </section>

  <section class="packages">

    <div class="card">
      <div class="coin">70 Coins</div>
      <div class="price">৳160</div>
      <button>View</button>
    </div>

    <div class="card">
      <div class="coin">100 Coins</div>
      <div class="price">৳210</div>
      <button>View</button>
    </div>

    <div class="card">
      <div class="coin">200 Coins</div>
      <div class="price">৳410</div>
      <button>View</button>
    </div>

    <div class="card">
      <div class="coin">350 Coins</div>
      <div class="price">৳710</div>
      <button>View</button>
    </div>

    <div class="card">
      <div class="coin">500 Coins</div>
      <div class="price">৳1,010</div>
      <button>View</button>
    </div>

    <div class="card">
      <div class="coin">700 Coins</div>
      <div class="price">৳1,410</div>
      <button>View</button>
    </div>

    <div class="card">
      <div class="coin">1,000 Coins</div>
      <div class="price">৳2,010</div>
      <button>View</button>
    </div>

  </section>

  <footer>
    © 2026 RAW SUJON
  </footer>

</body>
</html>
